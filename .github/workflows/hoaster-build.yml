name: Hoaster static build
on:
  push:
    branches:
      - chore/hoaster-build
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ippm-hoaster-dist
          path: dist/
          if-no-files-found: error
